name: Build wheels

# Manual only, and the artifacts are still throwaway — publishing to a release
# and an index comes once these are proven.
on:
  workflow_dispatch:
    inputs:
      open3d_ref:
        description: Open3D ref — a branch, a tag, or a full 40-char commit SHA
        default: aab533f300c5de61367478e500e078b1b93068b2
      pythons:
        description: JSON array of docker_build.sh python tags
        default: '["py310","py311","py312","py313","py314"]'

jobs:
  build:
    # Every wheel comes from one ref. Mixing a release tag with main would put
    # two different Open3D versions under one distribution name in the index.
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(inputs.pythons) }}

    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350

    steps:
      - name: Validate the ref
        # actions/checkout only recognises a full 40-char SHA as a commit;
        # anything shorter it treats as a branch name and fails on the fetch
        # rather than saying so.
        run: |
          ref='${{ inputs.open3d_ref }}'
          if printf '%s' "$ref" | grep -qE '^[0-9a-f]{7,39}$'; then
            echo "::error::'$ref' looks like an abbreviated SHA; actions/checkout needs all 40 characters"
            exit 1
          fi

      - name: Check out Open3D
        uses: actions/checkout@v4
        with:
          repository: isl-org/Open3D
          ref: ${{ inputs.open3d_ref }}
          submodules: recursive

      - name: Accept the Anaconda channel ToS
        # Only the release tags need this: upstream replaced Miniconda with
        # pyenv in Dockerfile.openblas after v0.19.0. Where conda is still used,
        # the Open3D source is pinned but the installer is not — the Dockerfile
        # fetches `Miniconda3-latest`, which now bundles the ToS plugin and
        # refuses to create an env from the default channels non-interactively.
        # That fails `conda create` on every arch. Nothing else about the build
        # changes.
        run: |
          f=docker/Dockerfile.openblas
          if ! grep -q '^RUN conda create -y -n open3d' "$f"; then
            echo "$f does not use conda (pyenv build) — nothing to patch"
            exit 0
          fi
          sed -i 's|^RUN conda create -y -n open3d|ENV CONDA_PLUGINS_AUTO_ACCEPT_TOS=yes\nRUN conda create -y -n open3d|' "$f"
          # A silently unapplied patch would resurface as the same opaque conda
          # error 40 minutes into the build. Fail here instead.
          grep -q '^ENV CONDA_PLUGINS_AUTO_ACCEPT_TOS=yes' "$f" \
            || { echo "::error::ToS patch did not apply to $f"; exit 1; }
          grep -n -B1 -A1 '^ENV CONDA_PLUGINS_AUTO_ACCEPT_TOS' "$f"

      - name: Build
        run: |
          cd docker
          ./docker_build.sh "openblas-arm64-${{ matrix.python }}"

      - name: Inspect the wheel
        # Upstream runs no auditwheel, so expect a bare `linux_aarch64` tag.
        # That is fine when self-hosting: `linux_<arch>` is the last entry pip
        # yields in its own supported-tag list, so it installs. PyPI refuses to
        # *host* such wheels; pip does not refuse to install them.
        #
        # glibc is the real portability limit. The base image is
        # arm64v8/ubuntu:22.04, so these need glibc >= 2.35 — fine on JetPack 6
        # (Ubuntu 22.04), too new for JetPack 5 (Ubuntu 20.04, glibc 2.31).
        # Report the floor the binaries actually ask for rather than inferring
        # it from the base image.
        run: |
          shopt -s nullglob
          wheels=(docker/*.whl)
          if [ ${#wheels[@]} -eq 0 ]; then
            echo "::error::no wheel was produced"
            exit 1
          fi
          for w in "${wheels[@]}"; do
            echo "=== $w"
            ls -lh "$w"
            unzip -p "$w" '*/WHEEL'
            tmp=$(mktemp -d)
            unzip -q -o "$w" -d "$tmp"
            echo "--- highest glibc symbol versions required:"
            find "$tmp" -name '*.so*' -exec sh -c \
              'objdump -T "$1" 2>/dev/null | grep -oE "GLIBC_[0-9.]+"' _ {} \; \
              | sort -uV | tail -3
            rm -rf "$tmp"
          done

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.python }}
          path: docker/*.whl
          if-no-files-found: error
