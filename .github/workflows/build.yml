name: Build wheel

# Spike: prove one arm64 wheel can be built before adding a matrix, releases or
# an index. Manual only, and the artifact is deliberately throwaway.
on:
  workflow_dispatch:
    inputs:
      open3d_ref:
        description: Open3D tag or commit to build
        default: v0.19.0
      target:
        description: docker_build.sh target
        default: openblas-arm64-py312

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350

    steps:
      - name: Check out Open3D
        uses: actions/checkout@v4
        with:
          repository: isl-org/Open3D
          ref: ${{ inputs.open3d_ref }}
          submodules: recursive

      - name: Accept the Anaconda channel ToS
        # Upstream pins the Open3D tag but not the Miniconda installer — the
        # Dockerfile fetches `Miniconda3-latest`, which now bundles the ToS
        # plugin and refuses to create an env from the default channels
        # non-interactively. So every Open3D docker build fails today, on every
        # arch, at `conda create`. Nothing about the build itself changes.
        run: |
          f=docker/Dockerfile.openblas
          sed -i 's|^RUN conda create -y -n open3d|ENV CONDA_PLUGINS_AUTO_ACCEPT_TOS=yes\nRUN conda create -y -n open3d|' "$f"
          # A silently unapplied patch would resurface as the same opaque conda
          # error 40 minutes into the build. Fail here instead.
          grep -q '^ENV CONDA_PLUGINS_AUTO_ACCEPT_TOS=yes' "$f" \
            || { echo "::error::ToS patch did not apply to $f"; exit 1; }
          grep -n -B1 -A1 '^ENV CONDA_PLUGINS_AUTO_ACCEPT_TOS' "$f"

      - name: Build
        run: |
          cd docker
          ./docker_build.sh "${{ inputs.target }}"

      - name: Inspect the wheel
        # A `linux_aarch64` tag is refused by pip at install time, so the build
        # is only useful if it produced a `manylinux_*` tag. Check before
        # celebrating a green run.
        run: |
          shopt -s nullglob
          wheels=(docker/*.whl)
          if [ ${#wheels[@]} -eq 0 ]; then
            echo "::error::no wheel was produced"
            exit 1
          fi
          for w in "${wheels[@]}"; do
            echo "=== $w"
            ls -lh "$w"
            unzip -p "$w" '*/WHEEL'
            case "$(basename "$w")" in
              *manylinux*aarch64*) echo "tag OK" ;;
              *) echo "::warning::not a manylinux aarch64 wheel — needs auditwheel repair" ;;
            esac
          done

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ inputs.target }}
          path: docker/*.whl
          if-no-files-found: error
